name: Debug sources

# Manual only. Use it when a build reports an error for a source, or to copy the live data somewhere
# you can reach it. Each step makes one small request; nothing is published to the site.
on:
  workflow_dispatch:

permissions:
  contents: write     # only for the snapshot branch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: AEMET archive (status and size only)
        run: curl -sI https://www.aemet.es/es/api-eltiempo/modelos/download/harmonie/PB | grep -iE "^HTTP|content-length|content-type" || true

      - name: Puertos del Estado, newest forecast file per wave model
        run: |
          y=$(date -u +%Y); m=$(date -u +%m)
          for ds in wave_regional_ibi wave_regional_gib; do
            f=$(curl -s "https://opendap.puertos.es/thredds/catalog/$ds/$y/$m/catalog.xml" | grep -o 'HW-[0-9]*-[0-9]*-B[0-9]*-FC.nc' | sort -t B -k2 | tail -1)
            echo "$ds: ${f:-nothing this month}"
            [ -n "$f" ] && curl -s -o /dev/null -w "  subset service: %{http_code}\n" "https://opendap.puertos.es/thredds/ncss/grid/$ds/$y/$m/$f/dataset.xml"
          done

      - name: Open-Meteo, one point each (ECMWF wind, MFWAM waves, SMOC tide)
        run: |
          curl -s "https://api.open-meteo.com/v1/forecast?latitude=36.03&longitude=-5.70&hourly=wind_speed_10m&models=ecmwf_ifs&forecast_hours=3" | head -c 600; echo
          curl -s "https://marine-api.open-meteo.com/v1/marine?latitude=36.03&longitude=-5.70&hourly=wave_height,swell_wave_height&models=meteofrance_wave&cell_selection=sea&forecast_hours=3" | head -c 600; echo
          curl -s "https://marine-api.open-meteo.com/v1/marine?latitude=36.03&longitude=-5.70&hourly=sea_level_height_msl&cell_selection=sea&forecast_hours=3" | head -c 600; echo

      - name: Live report
        run: curl -s https://jakobwalt.github.io/sal-y-viento/data/report.json

      # The data files on the site, as one commit on the `snapshot` branch (overwritten each time).
      # Handy for working offline or from a machine that can reach GitHub but not github.io.
      - name: Snapshot live data to the snapshot branch
        run: |
          mkdir snap && cd snap
          for f in meta.json spots.json wind.bin waves.bin report.json; do
            curl -sf -o "$f" "https://jakobwalt.github.io/sal-y-viento/data/$f?nocache=$RANDOM" || echo "missing $f"
          done
          git init -q -b snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Live data snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshot
