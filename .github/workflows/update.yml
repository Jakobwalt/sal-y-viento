name: Update forecast and deploy

on:
  schedule:
    # About 4 h after each AEMET HARMONIE run (00, 06, 12, 18 UTC). Tune once we know the real publish times.
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write     # only for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Fetch forecasts and build data files
        run: python -m pipeline.build --out site/data --previous "https://jakobwalt.github.io/sal-y-viento"

      - name: Summary
        if: always()
        run: |
          if [ -f site/data/report.json ]; then
            { echo '### Forecast build'; echo '```json'; cat site/data/report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows after 60 days without repository activity.
      # An empty commit every ~45 days keeps the schedule alive.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled forecast updates active"
            git push
          fi
