name: Debug sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wave catalogue and services
        run: |
          set -x
          base=https://opendap.puertos.es/thredds
          y=$(date -u +%Y); m=$(date -u +%m)
          curl -s "$base/catalog/wave_regional_gib/$y/$m/catalog.xml" | tail -c 2500 || true
          echo; echo ----- root catalog
          curl -s "$base/catalog/wave_regional_gib/catalog.xml" | head -c 2500 || true
          echo; echo ----- services of newest FC file
          f=$(curl -s "$base/catalog/wave_regional_gib/$y/$m/catalog.xml" | grep -o 'HW-[0-9]*-[0-9]*-B[0-9]*-FC.nc' | sort -t B -k2 | tail -1)
          echo "newest: $f"
          curl -s "$base/catalog/wave_regional_gib/$y/$m/catalog.xml?dataset=wave_regional_gib/$y/$m/$f" | head -c 3000 || true
          echo; echo ----- NCSS dataset.xml
          curl -s -o /dev/null -w "%{http_code}\n" "$base/ncss/wave_regional_gib/$y/$m/$f/dataset.xml"
          curl -s "$base/ncss/grid/wave_regional_gib/$y/$m/$f/dataset.xml" | head -c 1500; echo
          curl -s -o /dev/null -w "ncss/grid: %{http_code}\n" "$base/ncss/grid/wave_regional_gib/$y/$m/$f/dataset.xml"
          curl -s -o /dev/null -w "fileServer: %{http_code}\n" -r 0-100 "$base/fileServer/wave_regional_gib/$y/$m/$f"
          curl -s -o /dev/null -w "dodsC: %{http_code}\n" "$base/dodsC/wave_regional_gib/$y/$m/$f.dds"
          curl -s "$base/dodsC/wave_regional_gib/$y/$m/$f.dds" | head -40
      - name: Wave datasets on the server
        run: |
          y=$(date -u +%Y); m=$(date -u +%m)
          for g in wave_regional_ibi wave_regional_gib wave_coast_s01 wave_coast_s02 wave_coast_s05 wave_coast_s05b harmonie1k_tarifa harmonie1k_algeciras; do
            f=$(curl -s https://opendap.puertos.es/thredds/catalog/$g/$y/$m/catalog.xml | grep -o 'name="[^"]*\.nc"' | grep -v HC | sed 's/name="//;s/"//' | sort | tail -1)
            [ -z "$f" ] && f=$(curl -s https://opendap.puertos.es/thredds/catalog/$g/catalog.xml | grep -o 'name="[^"]*"' | tail -3 | tr '\n' ' ')
            echo "== $g  $f"
            curl -s "https://opendap.puertos.es/thredds/ncss/grid/$g/$y/$m/$f/dataset.xml" | tr -d '\n' | grep -o '<LatLonBox>.*</LatLonBox>\|<axis name="[a-z]*" shape="[^"]*"\|<grid name="[A-Za-z0-9_]*"' | tr '\n' ' ' | sed 's/  */ /g'; echo
          done
      - name: Live report
        run: curl -s https://jakobwalt.github.io/sal-y-viento/data/report.json
      - name: Snapshot live data to the snapshot branch
        run: |
          mkdir snap && cd snap
          for f in meta.json spots.json wind.bin waves.bin report.json; do
            curl -sf -o "$f" "https://jakobwalt.github.io/sal-y-viento/data/$f?nocache=$RANDOM" || echo "missing $f"
          done
          git init -q -b snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Live data snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshot
