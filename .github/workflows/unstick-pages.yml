name: Cancel a stuck Pages deployment

# Use when a deploy fails with "due to in progress deployment. Please cancel <id> first".
on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "The id from the error message"
        required: true

permissions:
  pages: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="repos/${{ github.repository }}/pages/deployments/${{ inputs.deployment_id }}"
          echo "before:"; gh api "$d" || true
          gh api -X POST "$d/cancel" && echo cancelled
          sleep 20; echo "after:"; gh api "$d" || true
          echo "pages:"; gh api "repos/${{ github.repository }}/pages" || true
