name: Update forecast and deploy

on:
  schedule:
    # Hourly, at an off-peak minute. Each check is only a HEAD request to AEMET and two wave
    # catalogue reads; the downloads and the Open-Meteo request happen only when a new run exists.
    # Hourly also means a dropped GitHub schedule costs an hour, not six.
    - cron: "47 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["site/**", "pipeline/**", ".github/workflows/update.yml"]

permissions:
  contents: write     # only for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      # Scheduled runs fetch only when a source has a new run; a code push just republishes the live data.
      - name: Fetch forecasts and build data files
        id: build
        run: |
          extra=""
          [ "${{ github.event_name }}" = "push" ] && extra="--reuse-only"
          python -m pipeline.build --out site/data --previous "https://jakobwalt.github.io/sal-y-viento" $extra

      - name: Summary
        if: always()
        run: |
          if [ -f site/data/report.json ]; then
            { echo '### Forecast build'; echo '```json'; cat site/data/report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v5
        if: steps.build.outputs.changed != 'false'
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.changed != 'false'
        with:
          path: site
      - id: deployment
        if: steps.build.outputs.changed != 'false'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Pages occasionally times out or reports a deployment still in progress; wait and try once more.
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows after 60 days without repository activity.
      # An empty commit every ~45 days keeps the schedule alive.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled forecast updates active"
            git push
          fi
